name: Build EZP

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Un Mac de GitHub compile les 4 versions et signe l'app macOS « ad hoc » (indispensable sur Apple Silicon).
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Pillow (icône macOS)
        run: python3 -m pip install --break-system-packages pillow || python3 -m pip install pillow
      - name: Tests, compilation et zips
        run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: EZP
          path: out/*.zip
      # Sur main : si la version du .csproj n'a pas encore de Release, crée le tag vX.Y.Z et la Release avec les 4 zips
      - name: Version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/EFP.Desktop/EFP.Desktop.csproj)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "new=false" >> "$GITHUB_OUTPUT"; else echo "new=true" >> "$GITHUB_OUTPUT"; fi
      - name: Release
        if: github.ref == 'refs/heads/main' && steps.v.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: EZP ${{ steps.v.outputs.version }}
          files: out/*.zip
          generate_release_notes: true
