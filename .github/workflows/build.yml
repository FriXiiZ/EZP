name: Build EZP

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Un Mac de GitHub compile les 4 versions et signe l'app macOS « ad hoc » (indispensable sur Apple Silicon).
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Pillow (icône macOS)
        run: python3 -m pip install --break-system-packages pillow || python3 -m pip install pillow
      - name: Tests, compilation et zips
        run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: EZP
          path: out/*.zip
      # Sur un tag vX.Y.Z : crée la Release GitHub avec les 4 zips
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.zip
          generate_release_notes: true
